name: Page Check

on:
  push:
  workflow_dispatch:

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f data/source-manifest.json
          test -f data/schema.md
          test -f docs/criteria-summary.md

      - name: Validate source manifest JSON
        run: python -m json.tool data/source-manifest.json

      - name: Check assessment references
        run: |
          grep -q "SELSI" data/source-manifest.json
          grep -q "PRES" data/source-manifest.json
          grep -q "REVT" data/source-manifest.json
          grep -q "SELSI" docs/criteria-summary.md
          grep -q "PRES" docs/criteria-summary.md
          grep -q "REVT" docs/criteria-summary.md

      - name: Check page content
        run: |
          grep -q "언어검사 채점기" index.html
          grep -q "SELSI" index.html
          grep -q "PRES" index.html
          grep -q "REVT" index.html
